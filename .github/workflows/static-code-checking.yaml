name: Static code checking
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code_linting:
    runs-on: ubuntu-latest
    steps:
      - name: Setup dependencies
        uses: ../.github/actions/npm-setup

      - name: Run ESLint
        run: npx eslint . --max-warnings 0
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup dependencies
        uses: ../.github/actions/npm-setup

      - name: Build
        run: npm run build
